# Project-wide Gradle settings.
# Pinned deterministic JVM arguments for reproducible builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US

# AndroidX and optimization settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Configuration Cache and parallel execution
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin code style
kotlin.code.style=official
